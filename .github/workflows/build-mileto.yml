name: Build and Push Mileto Docker Image

# Este workflow es OPCIONAL - solo si quieres automatizar el build con GitHub Actions
# Puedes usar el script build-and-push.sh en su lugar

on:
  push:
    branches:
      - mileto-master  # Cambia esto a tu branch principal
    paths:
      - 'app/javascript/**'
      - 'public/brand-assets/**'
      - 'Dockerfile.mileto'
      - 'db/migrate/**'
  workflow_dispatch:  # Permite ejecutarlo manualmente

env:
  REGISTRY: docker.io
  IMAGE_NAME: mileto-chatwoot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mileto
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

# Para usar este workflow:
# 1. Ve a GitHub → Settings → Secrets → Actions
# 2. Agrega estos secrets:
#    - DOCKER_USERNAME: tu usuario de Docker Hub
#    - DOCKER_PASSWORD: tu token de Docker Hub (crear en https://hub.docker.com/settings/security)
# 3. Haz push a tu branch y el workflow se ejecutará automáticamente
